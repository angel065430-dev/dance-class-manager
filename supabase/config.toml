# Local Supabase configuration
project_id = "dance-class-manager"

[api]
enabled = true
port = 18081
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 15432
shadow_port = 54320
health_timeout = "2m"
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = true

[studio]
enabled = true
port = 18082
api_url = "http://127.0.0.1:18081"
openai_api_key = "env(OPENAI_API_KEY)"

[local_smtp]
enabled = true
port = 18083

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

[storage.vector]
enabled = true
max_buckets = 10
max_indexes = 5

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://127.0.0.1:5173",
  "http://localhost:5173"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Public GoTrue signup is disabled. Student accounts are provisioned only by the
# invitation-validating Edge Function with service role; admins are also created
# through an authorized administrative process.
enable_signup = false
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
# Keep the email provider enabled so pre-provisioned admins can sign in with
# email + password. New public accounts remain blocked by auth.enable_signup.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Phone authentication configuration.
#
# This project uses Phone + PIN as a password login flow.
# It does not use SMS OTP as the normal application login flow.
[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# 本系統不啟用 Phone provider，避免 Supabase 強制要求 SMS provider。
# 學生仍只使用手機＋PIN；Edge Function 將手機雜湊為不可逆的內部 Auth email
# identifier，再使用 Supabase Password Auth。不發送 email/SMS，也沒有假憑證。

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

[auth.web3.solana]
enabled = false

[functions.create-student-account]
verify_jwt = false

[functions.admin-reset-student-pin]
# Hosted projects may use the new signing-key system. Authenticate the caller
# inside the function with auth.getUser(), then enforce the admin role again.
verify_jwt = false

[functions.admin-create-student-invitation]
# Same fail-closed in-function user and admin-role verification as above.
verify_jwt = false

[functions.student-pin-login]
verify_jwt = false

[auth.third_party.firebase]
enabled = false

[auth.third_party.auth0]
enabled = false

[auth.third_party.aws_cognito]
enabled = false

[auth.third_party.clerk]
enabled = false

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# Analytics is not required for this project during development.
# Disabled to avoid the local port 54327 conflict.
[analytics]
enabled = false
port = 54327
backend = "postgres"

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"

[experimental.pgdelta]
enabled = true
